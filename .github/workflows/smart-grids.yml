name: Smart Grids

on:
  push:
    paths:
      - "articles/smart-grids/**"
      - ".github/workflows/smart-grids.yml"
  pull_request:
    paths:
      - "articles/smart-grids/**"
      - ".github/workflows/smart-grids.yml"

jobs:
  validate:
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run article workflow
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: bash articles/smart-grids/run_all.sh
      - name: Require clean generated outputs
        run: git diff --exit-code -- articles/smart-grids
