name: Energy Flows and Sankey Diagrams

on:
  push:
    paths:
      - "articles/energy-flows-and-sankey-diagrams/**"
      - ".github/workflows/energy-flows-and-sankey-diagrams.yml"
  pull_request:
    paths:
      - "articles/energy-flows-and-sankey-diagrams/**"
      - ".github/workflows/energy-flows-and-sankey-diagrams.yml"

jobs:
  validate:
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run article workflow
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: bash articles/energy-flows-and-sankey-diagrams/run_all.sh
      - name: Require clean generated outputs
        run: git diff --exit-code -- articles/energy-flows-and-sankey-diagrams
